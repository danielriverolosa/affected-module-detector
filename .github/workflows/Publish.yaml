name: Publish Plugin

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve Version
        id: version
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            echo "arg=-Pversion=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and Test Plugin
        run: ./gradlew check ${{ steps.version.outputs.arg }}

      - name: Publish to GitHub Packages
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository ${{ steps.version.outputs.arg }}

      - name: Publish to Gradle Plugin Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          if [ -n "$GRADLE_PUBLISH_KEY" ] && [ -n "$GRADLE_PUBLISH_SECRET" ]; then
            ./gradlew publishPlugins --no-configuration-cache ${{ steps.version.outputs.arg }}
          else
            echo "Skipping Gradle Plugin Portal publish (credentials not configured)."
          fi
