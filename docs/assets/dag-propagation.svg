<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="100%" height="100%">
  <style>
    .canvas { fill: #FAFAFA; stroke: #E4E4E7; stroke-width: 1; }
    .divider { stroke: #D4D4D8; stroke-width: 1; stroke-dasharray: 4 4; }
    .heading { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #18181B; }
    .sub { font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #52525B; }
    .node-skip { fill: #FFFFFF; stroke: #D4D4D8; stroke-width: 1; stroke-dasharray: 3 3; }
    .node-active { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.5; }
    .node-dep { fill: #FFFFFF; stroke: #18181B; stroke-width: 1.5; }
    .label-skip { font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #A1A1AA; }
    .label-active { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1D4ED8; }
    .label-dep { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #18181B; }
    .status-skip { font: 500 9px -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: 0.05em; fill: #A1A1AA; }
    .status-active { font: 600 9px -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: 0.05em; fill: #1D4ED8; }
    .status-dep { font: 600 9px -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: 0.05em; fill: #52525B; }
    .edge-skip { stroke: #D4D4D8; stroke-width: 1; fill: none; }
    .edge-active { stroke: #18181B; stroke-width: 1.5; fill: none; }
    .arr-skip { fill: #D4D4D8; }
    .arr-active { fill: #18181B; }
    .footer { fill: #F4F4F5; stroke: #E4E4E7; stroke-width: 1; }
    .block-pill { fill: #FEF2F2; stroke: #FECACA; stroke-width: 1; }
    .block-text { font: 600 9px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #B91C1C; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0D1117; stroke: #30363D; }
      .divider { stroke: #30363D; }
      .heading { fill: #E6EDF3; }
      .sub { fill: #8B949E; }
      .node-skip { fill: #0D1117; stroke: #30363D; }
      .node-active { fill: #121D2F; stroke: #388BFD; }
      .node-dep { fill: #161B22; stroke: #E6EDF3; }
      .label-skip { fill: #484F58; }
      .label-active { fill: #58A6FF; }
      .label-dep { fill: #E6EDF3; }
      .status-skip { fill: #484F58; }
      .status-active { fill: #58A6FF; }
      .status-dep { fill: #8B949E; }
      .edge-skip { stroke: #30363D; }
      .edge-active { stroke: #E6EDF3; }
      .arr-skip { fill: #30363D; }
      .arr-active { fill: #E6EDF3; }
      .footer { fill: #161B22; stroke: #30363D; }
      .block-pill { fill: #2D1215; stroke: #F85149; }
      .block-text { fill: #FF7B72; }
    }
  </style>

