<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="100%" height="100%">
  <defs>
    <style>
      .canvas { fill: #F8F9FA; stroke: #DADCE0; stroke-width: 1; }
      .grid { stroke: #E8EAED; stroke-width: 1; }
      .divider { stroke: #DADCE0; stroke-width: 1; stroke-dasharray: 4 4; }

      .g-blue-bar { fill: #4285F4; }
      .g-red-bar { fill: #EA4335; }
      .g-yellow-bar { fill: #FBBC04; }
      .g-green-bar { fill: #34A853; }

      .node-mod { fill: #E6F4EA; stroke: #1E8E3E; stroke-width: 1.5; }
      .node-dep { fill: #E8F0FE; stroke: #1A73E8; stroke-width: 1.5; }
      .node-test { fill: #FEF7E0; stroke: #F9AB00; stroke-width: 1.5; }
      .node-skip { fill: #FFFFFF; stroke: #DADCE0; stroke-width: 1; stroke-dasharray: 4 3; }
      .badge-stop { fill: #FCE8E6; stroke: #D93025; stroke-width: 1; }
      .summary { fill: #FFFFFF; stroke: #DADCE0; stroke-width: 1; }

      .txt-h { font-family: 'Google Sans', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #202124; }
      .txt-diff { font-family: 'Roboto Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #5F6368; }

      .txt-mod { font-family: 'Roboto Mono', 'JetBrains Mono', Menlo, monospace; font-size: 12px; font-weight: 700; fill: #0D652D; }
      .txt-mod-sub { font-family: 'Google Sans', 'Roboto', sans-serif; font-size: 9.5px; font-weight: 700; fill: #1E8E3E; letter-spacing: 0.04em; }

      .txt-dep { font-family: 'Roboto Mono', 'JetBrains Mono', Menlo, monospace; font-size: 12px; font-weight: 700; fill: #174EA6; }
      .txt-dep-sub { font-family: 'Google Sans', 'Roboto', sans-serif; font-size: 9.5px; font-weight: 700; fill: #1A73E8; letter-spacing: 0.04em; }

      .txt-test { font-family: 'Roboto Mono', 'JetBrains Mono', Menlo, monospace; font-size: 12px; font-weight: 700; fill: #B06000; }
      .txt-test-sub { font-family: 'Google Sans', 'Roboto', sans-serif; font-size: 9.5px; font-weight: 700; fill: #E37400; letter-spacing: 0.04em; }

      .txt-skip { font-family: 'Roboto Mono', 'JetBrains Mono', Menlo, monospace; font-size: 11.5px; fill: #80868B; }
      .txt-skip-sub { font-family: 'Google Sans', 'Roboto', sans-serif; font-size: 9.5px; font-weight: 600; fill: #9AA0A6; letter-spacing: 0.04em; }

      .txt-stop { font-family: 'Google Sans', 'Roboto', sans-serif; font-size: 9.5px; font-weight: 700; fill: #C5221F; letter-spacing: 0.05em; }
      .txt-sum { font-family: 'Roboto Mono', 'JetBrains Mono', Menlo, monospace; font-size: 11px; fill: #202124; }

      .edge-idle { stroke: #DADCE0; stroke-width: 1.25; fill: none; }
      .edge-prop { stroke: #1A73E8; stroke-width: 1.75; fill: none; }
      .edge-block { stroke: #D93025; stroke-width: 1.25; stroke-dasharray: 4 4; fill: none; }
      .arr-idle { fill: #DADCE0; }
      .arr-prop { fill: #1A73E8; }

      @media (prefers-color-scheme: dark) {
        .canvas { fill: #131314; stroke: #3C4043; }
        .grid { stroke: #1E1F20; }
        .divider { stroke: #3C4043; }

        .node-mod { fill: #0D2E1B; stroke: #81C995; }
        .node-dep { fill: #172B4D; stroke: #8AB4F8; }
        .node-test { fill: #332607; stroke: #FDD663; }
        .node-skip { fill: #1E1F20; stroke: #3C4043; }
        .badge-stop { fill: #381314; stroke: #F28B82; }
        .summary { fill: #1E1F20; stroke: #3C4043; }

        .txt-h { fill: #E8EAED; }
        .txt-diff { fill: #9AA0A6; }

        .txt-mod { fill: #81C995; }
        .txt-mod-sub { fill: #A8DAB5; }
        .txt-dep { fill: #8AB4F8; }
        .txt-dep-sub { fill: #AECBFA; }
        .txt-test { fill: #FDD663; }
        .txt-test-sub { fill: #FDE293; }
        .txt-skip { fill: #5F6368; }
        .txt-skip-sub { fill: #5F6368; }
        .txt-stop { fill: #F28B82; }
        .txt-sum { fill: #E8EAED; }

        .edge-idle { stroke: #3C4043; }
        .edge-prop { stroke: #8AB4F8; }
        .edge-block { stroke: #F28B82; }
        .arr-idle { fill: #3C4043; }
        .arr-prop { fill: #8AB4F8; }
      }
