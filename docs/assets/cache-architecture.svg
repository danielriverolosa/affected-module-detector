<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <style>
    .canvas { fill: #FAFAFA; stroke: #E4E4E7; stroke-width: 1; }
    .lane { fill: #FFFFFF; stroke: #D4D4D8; stroke-width: 1; }
    .step { fill: #F4F4F5; stroke: #D4D4D8; stroke-width: 1; }
    .step-bad { fill: #FEF2F2; stroke: #FCA5A5; stroke-width: 1.2; }
    .step-good { fill: #EFF6FF; stroke: #93C5FD; stroke-width: 1.2; }
    .label-lane { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.05em; fill: #52525B; }
    .code { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #18181B; }
    .code-bad { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #B91C1C; }
    .code-good { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1D4ED8; }
    .desc { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #52525B; }
    .line { stroke: #71717A; stroke-width: 1.2; fill: none; }
    .arr { fill: #71717A; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0D1117; stroke: #30363D; }
      .lane { fill: #161B22; stroke: #30363D; }
      .step { fill: #0D1117; stroke: #30363D; }
      .step-bad { fill: #2D1215; stroke: #F85149; }
      .step-good { fill: #121D2F; stroke: #388BFD; }
      .label-lane { fill: #8B949E; }
      .code { fill: #E6EDF3; }
      .code-bad { fill: #FF7B72; }
      .code-good { fill: #58A6FF; }
      .desc { fill: #8B949E; }
      .line { stroke: #8B949E; }
      .arr { fill: #8B949E; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" class="arr"/>
    </marker>
  </defs>

  <rect width="960" height="280" rx="6" class="canvas"/>

  <!-- Top Lane: Legacy -->
  <rect x="24" y="20" width="912" height="110" rx="4" class="lane"/>
  <text x="40" y="42" class="label-lane">LEGACY APPROACH (EVALUATION-TIME TASK MUTATION)</text>

  <rect x="40" y="54" width="250" height="60" rx="3" class="step"/>
  <text x="56" y="78" class="code">afterEvaluate { exec("git") }</text>
  <text x="56" y="98" class="desc">Runs external process during config</text>

  <line x1="290" y1="84" x2="340" y2="84" class="line" marker-end="url(#arrow)"/>

  <rect x="342" y="54" width="260" height="60" rx="3" class="step"/>
  <text x="358" y="78" class="code">task.enabled = false</text>
  <text x="358" y="98" class="desc">Mutates task graph per Git HEAD</text>

  <line x1="602" y1="84" x2="652" y2="84" class="line" marker-end="url(#arrow)"/>

  <rect x="654" y="54" width="264" height="60" rx="3" class="step-bad"/>
  <text x="670" y="78" class="code-bad">Config Cache Invalidated</text>
  <text x="670" y="98" class="desc">Reconfigures entire build every commit</text>

  <!-- Bottom Lane: Decoupled Task Selector -->
  <rect x="24" y="150" width="912" height="110" rx="4" class="lane"/>
  <text x="40" y="172" class="label-lane">DECOUPLED TASK SELECTOR (VALUE SOURCE + SERIALIZABLE DAG INPUTS)</text>

  <rect x="40" y="184" width="250" height="60" rx="3" class="step"/>
  <text x="56" y="208" class="code">ValueSource + MapProperty</text>
  <text x="56" y="228" class="desc">Lazy git diff &amp; immutable DAG @Input</text>

  <line x1="290" y1="214" x2="340" y2="214" class="line" marker-end="url(#arrow)"/>

  <rect x="342" y="184" width="260" height="60" rx="3" class="step"/>
  <text x="358" y="208" class="code">printAffected*Tasks</text>
  <text x="358" y="228" class="desc">Outputs native task paths to stdout</text>

  <line x1="602" y1="214" x2="652" y2="214" class="line" marker-end="url(#arrow)"/>

  <rect x="654" y="184" width="264" height="60" rx="3" class="step-good"/>
  <text x="670" y="208" class="code-good">Config &amp; Build Cache Intact</text>
  <text x="670" y="228" class="desc">Reuses config cache &amp; AGP FROM-CACHE</text>
</svg>
