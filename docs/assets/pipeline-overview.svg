<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="100%" height="100%">
  <style>
    .canvas { fill: #FAFAFA; stroke: #E4E4E7; stroke-width: 1; }
    .grid-line { stroke: #E4E4E7; stroke-width: 1; stroke-dasharray: 3 3; }
    .box { fill: #FFFFFF; stroke: #D4D4D8; stroke-width: 1.2; }
    .box-core { fill: #FFFFFF; stroke: #18181B; stroke-width: 1.5; }
    .box-sub { fill: #F4F4F5; stroke: #E4E4E7; stroke-width: 1; }
    .title { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #18181B; }
    .section { font: 600 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.08em; fill: #71717A; }
    .code { font: 500 11.5px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #18181B; }
    .code-muted { font: 400 10.5px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #52525B; }
    .desc { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #52525B; }
    .tag { fill: #F4F4F5; stroke: #D4D4D8; stroke-width: 1; }
    .tag-blue { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1; }
    .code-blue { font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1D4ED8; }
    .connector { fill: none; stroke: #71717A; stroke-width: 1.2; }
    .arrow { fill: #71717A; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0D1117; stroke: #30363D; }
      .grid-line { stroke: #21262D; }
      .box { fill: #161B22; stroke: #30363D; }
      .box-core { fill: #161B22; stroke: #8B949E; }
      .box-sub { fill: #0D1117; stroke: #30363D; }
      .title { fill: #E6EDF3; }
      .section { fill: #8B949E; }
      .code { fill: #E6EDF3; }
      .code-muted { fill: #8B949E; }
      .desc { fill: #8B949E; }
      .tag { fill: #21262D; stroke: #30363D; }
      .tag-blue { fill: #121D2F; stroke: #1F6FEB; }
      .code-blue { fill: #58A6FF; }
      .connector { stroke: #8B949E; }
      .arrow { fill: #8B949E; }
    }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" class="arrow"/>
    </marker>
  </defs>

  <rect width="960" height="390" rx="6" class="canvas"/>

  <!-- Column Dividers -->
  <line x1="296" y1="20" x2="296" y2="370" class="grid-line"/>
  <line x1="644" y1="20" x2="644" y2="370" class="grid-line"/>

  <!-- Column Headers -->
  <text x="28" y="38" class="section">01 / INPUTS (CONFIGURATION PHASE)</text>
  <text x="320" y="38" class="section">02 / GRAPH &amp; PATH CLASSIFIER</text>
  <text x="668" y="38" class="section">03 / TASK SELECTOR OUTPUTS</text>

  <!-- Left Column: Inputs -->
  <rect x="28" y="56" width="244" height="86" rx="4" class="box"/>
  <text x="42" y="78" class="code">GitChangedFilesValueSource</text>
  <text x="42" y="96" class="desc">Gradle ValueSource API</text>
  <rect x="42" y="106" width="216" height="24" rx="3" class="box-sub"/>
  <text x="50" y="122" class="code-muted">git diff --name-only base...HEAD</text>

  <rect x="28" y="160" width="244" height="86" rx="4" class="box"/>
  <text x="42" y="182" class="code">Reverse Dependency DAG</text>
  <text x="42" y="200" class="desc">Serializable @Input MapProperty</text>
  <rect x="42" y="210" width="216" height="24" rx="3" class="box-sub"/>
  <text x="50" y="226" class="code-muted">Map&lt;Module, Set&lt;Dependent&gt;&gt;</text>

  <rect x="28" y="264" width="244" height="86" rx="4" class="box"/>
  <text x="42" y="286" class="code">AffectedModulesExtension</text>
  <text x="42" y="304" class="desc">DSL &amp; -P CLI property conventions</text>
  <rect x="42" y="314" width="216" height="24" rx="3" class="box-sub"/>
  <text x="50" y="330" class="code-muted">ignoredPaths, globalPaths, baseRef</text>

  <!-- Center Column: Calculator -->
  <rect x="320" y="56" width="300" height="294" rx="4" class="box-core"/>
  <text x="338" y="80" class="title">AffectedModuleCalculator</text>
  <text x="338" y="97" class="desc">Stateless Kotlin seam (no Gradle runtime imports)</text>

  <!-- 4 Rules inside Calculator -->
  <rect x="338" y="112" width="264" height="48" rx="3" class="box-sub"/>
  <rect x="348" y="122" width="68" height="18" rx="2" class="tag"/>
  <text x="382" y="135" text-anchor="middle" class="code-muted">IGNORED</text>
  <text x="426" y="134" class="code-muted">docs/**, *.md, .gitignore</text>
  <text x="426" y="150" class="desc">Emits empty output (skips CI step)</text>

  <rect x="338" y="168" width="264" height="48" rx="3" class="box-sub"/>
  <rect x="348" y="178" width="68" height="18" rx="2" class="tag"/>
  <text x="382" y="191" text-anchor="middle" class="code-muted">GLOBAL</text>
  <text x="426" y="190" class="code-muted">build-logic/**, libs.versions.toml</text>
  <text x="426" y="206" class="desc">Selects all modules in project</text>

  <rect x="338" y="224" width="264" height="48" rx="3" class="box-sub"/>
  <rect x="348" y="234" width="68" height="18" rx="2" class="tag-blue"/>
  <text x="382" y="247" text-anchor="middle" class="code-blue">TEST-ONLY</text>
  <text x="426" y="246" class="code-muted">src/test/** or src/androidTest/**</text>
  <text x="426" y="262" class="desc">Target module only (no DAG propagation)</text>

  <rect x="338" y="280" width="264" height="52" rx="3" class="box-sub"/>
  <rect x="348" y="290" width="68" height="18" rx="2" class="tag-blue"/>
  <text x="382" y="303" text-anchor="middle" class="code-blue">MAIN CODE</text>
  <text x="426" y="302" class="code-muted">src/main/**, build.gradle.kts</text>
  <text x="426" y="318" class="desc">BFS traversal over reverseDependencies</text>

  <!-- Right Column: 4 Tasks -->
  <rect x="668" y="56" width="264" height="62" rx="4" class="box"/>
  <text x="684" y="80" class="code">printAffectedTestTasks</text>
  <text x="684" y="100" class="code-muted">:mod:testDebugUnitTest  :dom:test</text>

  <rect x="668" y="133" width="264" height="62" rx="4" class="box"/>
  <text x="684" y="157" class="code">printAffectedScreenshotTasks</text>
  <text x="684" y="177" class="code-muted">:feature:*:verifyRoborazziDebug</text>

  <rect x="668" y="210" width="264" height="62" rx="4" class="box"/>
  <text x="684" y="234" class="code">printAffectedAndroidTestTasks</text>
  <text x="684" y="254" class="code-muted">:app:connectedDebugAndroidTest</text>

  <rect x="668" y="288" width="264" height="62" rx="4" class="box"/>
  <text x="684" y="312" class="code">printAffectedLintTasks</text>
  <text x="684" y="332" class="code-muted">:mod:lintRelease  :domain:lint</text>

  <!-- Connectors Left -> Center -->
  <path d="M 272 99 L 318 99" class="connector" marker-end="url(#arr)"/>
  <path d="M 272 203 L 318 203" class="connector" marker-end="url(#arr)"/>
  <path d="M 272 307 L 318 307" class="connector" marker-end="url(#arr)"/>

  <!-- Connectors Center -> Right -->
  <path d="M 620 135 L 644 135 L 644 87 L 666 87" class="connector" marker-end="url(#arr)"/>
  <path d="M 620 185 L 644 185 L 644 164 L 666 164" class="connector" marker-end="url(#arr)"/>
  <path d="M 620 241 L 666 241" class="connector" marker-end="url(#arr)"/>
  <path d="M 620 319 L 666 319" class="connector" marker-end="url(#arr)"/>
</svg>
