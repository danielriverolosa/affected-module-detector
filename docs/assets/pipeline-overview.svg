    <text x="466" y="379" font-family="ui-monospace, monospace" font-size="11" fill="#34D399">src/main/**, build.gradle.kts</text>
    <text x="466" y="398" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#10B981">→ Transitive BFS on Reverse DAG</text>
