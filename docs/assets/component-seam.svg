<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="100%">
  <style>
    .canvas { fill: #FAFAFA; stroke: #E4E4E7; stroke-width: 1; }
    .zone-gradle { fill: #FFFFFF; stroke: #D4D4D8; stroke-width: 1; stroke-dasharray: 4 4; }
    .zone-pure { fill: #FFFFFF; stroke: #18181B; stroke-width: 1.5; }
    .card { fill: #F4F4F5; stroke: #D4D4D8; stroke-width: 1; }
    .card-seam { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.2; }
    .zone-title { font: 600 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.08em; fill: #71717A; }
    .code { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #18181B; }
    .code-seam { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1D4ED8; }
    .meta { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52525B; }
    .edge { stroke: #71717A; stroke-width: 1.2; fill: none; }
    .arr { fill: #71717A; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0D1117; stroke: #30363D; }
      .zone-gradle { fill: #0D1117; stroke: #30363D; }
      .zone-pure { fill: #161B22; stroke: #8B949E; }
      .card { fill: #161B22; stroke: #30363D; }
      .card-seam { fill: #121D2F; stroke: #388BFD; }
      .zone-title { fill: #8B949E; }
      .code { fill: #E6EDF3; }
      .code-seam { fill: #58A6FF; }
      .meta { fill: #8B949E; }
      .edge { stroke: #8B949E; }
      .arr { fill: #8B949E; }
    }
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" class="arr"/>
    </marker>
  </defs>

  <rect width="960" height="340" rx="6" class="canvas"/>

  <!-- Left Zone: Gradle Adapter -->
  <rect x="24" y="20" width="564" height="300" rx="4" class="zone-gradle"/>
  <text x="40" y="42" class="zone-title">GRADLE 9 ADAPTER LAYER (org.gradle.api.*)</text>

  <!-- Right Zone: Pure Kotlin Seam -->
  <rect x="612" y="20" width="324" height="300" rx="4" class="zone-pure"/>
  <text x="628" y="42" class="zone-title">PURE KOTLIN CORE SEAM (ZERO GRADLE IMPORTS)</text>

  <!-- Cards inside Gradle Adapter -->
  <rect x="40" y="60" width="240" height="106" rx="4" class="card"/>
  <text x="54" y="82" class="code">AffectedModulesPlugin</text>
  <text x="54" y="102" class="meta">• Extracts reverse dependency DAG</text>
  <text x="54" y="120" class="meta">• Detects Android / JVM / Roborazzi</text>
  <text x="54" y="138" class="meta">• Registers 4 root selector tasks</text>

  <rect x="40" y="190" width="240" height="106" rx="4" class="card"/>
  <text x="54" y="212" class="code">AffectedModulesExtension</text>
  <text x="54" y="232" class="meta">• baseRef: Property&lt;String&gt;</text>
  <text x="54" y="250" class="meta">• ignoredPaths / globalPaths</text>
  <text x="54" y="268" class="meta">• Task &amp; plugin ID conventions</text>

  <rect x="328" y="60" width="240" height="94" rx="4" class="card"/>
  <text x="342" y="82" class="code">GitChangedFilesValueSource</text>
  <text x="342" y="102" class="meta">• Injected ExecOperations</text>
  <text x="342" y="120" class="meta">• Runs git diff baseRef...HEAD</text>
  <text x="342" y="138" class="meta">• Throws GradleException on failure</text>

  <rect x="328" y="178" width="240" height="118" rx="4" class="card"/>
  <text x="342" y="200" class="code">PrintAffectedTasksTask</text>
  <text x="342" y="220" class="meta">• @DisableCachingByDefault</text>
  <text x="342" y="238" class="meta">• Serializable @Input properties</text>
  <text x="342" y="256" class="meta">• Zero Task.project references</text>
  <text x="342" y="274" class="meta">• Prints matched tasks to stdout</text>

  <!-- Cards inside Pure Kotlin Seam -->
  <rect x="628" y="60" width="292" height="130" rx="4" class="card-seam"/>
  <text x="644" y="84" class="code-seam">AffectedModuleCalculator</text>
  <text x="644" y="106" class="meta">• Longest-prefix module path matching</text>
  <text x="644" y="124" class="meta">• Separates src/test vs src/androidTest</text>
  <text x="644" y="142" class="meta">• Transitive BFS on reverseDependencies</text>
  <text x="644" y="160" class="meta">• Pure function: calculate(...)</text>

  <rect x="628" y="214" width="292" height="82" rx="4" class="card"/>
  <text x="644" y="236" class="code">AffectedAnalysisResult</text>
  <text x="644" y="256" class="meta">• affectedTestModules / ScreenshotModules</text>
  <text x="644" y="274" class="meta">• affectedAndroidTestModules / LintModules</text>

  <!-- Connectors -->
  <line x1="280" y1="100" x2="326" y2="100" class="edge" marker-end="url(#ar)"/>
  <line x1="280" y1="130" x2="326" y2="215" class="edge" marker-end="url(#ar)"/>
  <line x1="160" y1="166" x2="160" y2="188" class="edge" marker-end="url(#ar)"/>
  <line x1="448" y1="154" x2="448" y2="176" class="edge" marker-end="url(#ar)"/>
  <line x1="568" y1="237" x2="626" y2="135" class="edge" marker-end="url(#ar)"/>
  <line x1="774" y1="190" x2="774" y2="212" class="edge" marker-end="url(#ar)"/>
</svg>
