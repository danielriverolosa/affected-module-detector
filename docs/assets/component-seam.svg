<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" width="100%" height="100%">
  <defs>
    <style>
      .canvas { fill: #F8F9FA; stroke: #DADCE0; stroke-width: 1; }
      .grid { stroke: #E8EAED; stroke-width: 1; }
      .zone-gradle { fill: #FFFFFF; stroke: #BDC1C6; stroke-width: 1; stroke-dasharray: 5 4; }
      .zone-core { fill: #E8F0FE; stroke: #1A73E8; stroke-width: 1.5; }
      .card { fill: #F8F9FA; stroke: #DADCE0; stroke-width: 1; }
      .card-core { fill: #FFFFFF; stroke: #1A73E8; stroke-width: 1.5; }
      .card-res { fill: #FFFFFF; stroke: #34A853; stroke-width: 1.5; }

      .g-blue-bar { fill: #4285F4; }
      .g-red-bar { fill: #EA4335; }
      .g-yellow-bar { fill: #FBBC04; }
      .g-green-bar { fill: #34A853; }

      .txt-zone { font-family: 'Google Sans', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; fill: #5F6368; letter-spacing: 0.08em; }
      .txt-zone-core { font-family: 'Google Sans', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; fill: #174EA6; letter-spacing: 0.08em; }
      .txt-title { font-family: 'Roboto Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #202124; }
      .txt-title-core { font-family: 'Roboto Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #174EA6; }
      .txt-title-res { font-family: 'Roboto Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #0D652D; }
      .txt-body { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11.5px; fill: #5F6368; }

      .wire { stroke: #80868B; stroke-width: 1.5; fill: none; }
      .wire-core { stroke: #1A73E8; stroke-width: 1.75; fill: none; }
      .arr { fill: #80868B; }
      .arr-core { fill: #1A73E8; }

      @media (prefers-color-scheme: dark) {
        .canvas { fill: #131314; stroke: #3C4043; }
        .grid { stroke: #1E1F20; }
        .zone-gradle { fill: #1E1F20; stroke: #5F6368; }
        .zone-core { fill: #172B4D; stroke: #8AB4F8; }
        .card { fill: #131314; stroke: #3C4043; }
        .card-core { fill: #1E1F20; stroke: #8AB4F8; }
        .card-res { fill: #1E1F20; stroke: #81C995; }

        .txt-zone { fill: #9AA0A6; }
        .txt-zone-core { fill: #8AB4F8; }
        .txt-title { fill: #E8EAED; }
        .txt-title-core { fill: #8AB4F8; }
        .txt-title-res { fill: #81C995; }
        .txt-body { fill: #9AA0A6; }

        .wire { stroke: #9AA0A6; }
        .wire-core { stroke: #8AB4F8; }
        .arr { fill: #9AA0A6; }
        .arr-core { fill: #8AB4F8; }
      }
    </style>
    <pattern id="ggrid4" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" class="grid"/>
    </pattern>
    <marker id="a4" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 7 4 L 0 6.5 z" class="arr"/>
    </marker>
    <marker id="a4c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 7 4 L 0 6.5 z" class="arr-core"/>
    </marker>
    <clipPath id="cclip4">
      <rect width="1080" height="390" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cclip4)">
    <rect width="1080" height="390" rx="10" class="canvas"/>
    <rect width="1080" height="390" rx="10" fill="url(#ggrid4)"/>
    <rect x="0" y="0" width="270" height="4" class="g-blue-bar"/>
    <rect x="270" y="0" width="270" height="4" class="g-red-bar"/>
    <rect x="540" y="0" width="270" height="4" class="g-yellow-bar"/>
    <rect x="810" y="0" width="270" height="4" class="g-green-bar"/>
  </g>
  <rect width="1080" height="390" rx="10" fill="none" class="canvas"/>

  <!-- ==================== LEFT ZONE: GRADLE ADAPTER ==================== -->
  <rect x="28" y="24" width="644" height="342" rx="8" class="zone-gradle"/>
  <text x="48" y="48" class="txt-zone">GRADLE 9 ADAPTER LAYER (org.gradle.api.*)</text>

  <!-- AffectedModulesPlugin -->
  <rect x="48" y="66" width="280" height="124" rx="6" class="card"/>
  <rect x="48" y="66" width="4" height="124" rx="2" class="g-blue-bar"/>
  <text x="66" y="92" class="txt-title">AffectedModulesPlugin</text>
  <text x="66" y="116" class="txt-body">• Extracts reverse dependency DAG</text>
  <text x="66" y="138" class="txt-body">• Detects Android / JVM / Roborazzi</text>
  <text x="66" y="160" class="txt-body">• Registers 4 root selector tasks</text>

  <!-- AffectedModulesExtension -->
  <rect x="48" y="220" width="280" height="124" rx="6" class="card"/>
  <rect x="48" y="220" width="4" height="124" rx="2" class="g-yellow-bar"/>
  <text x="66" y="246" class="txt-title">AffectedModulesExtension</text>
  <text x="66" y="270" class="txt-body">• baseRef: Property&lt;String&gt;</text>
  <text x="66" y="292" class="txt-body">• ignoredPaths / globalPaths</text>
  <text x="66" y="314" class="txt-body">• Task &amp; plugin ID conventions</text>

  <!-- GitChangedFilesValueSource -->
  <rect x="372" y="66" width="280" height="110" rx="6" class="card"/>
  <rect x="372" y="66" width="4" height="110" rx="2" class="g-red-bar"/>
  <text x="390" y="92" class="txt-title">GitChangedFilesValueSource</text>
  <text x="390" y="116" class="txt-body">• Injected ExecOperations</text>
  <text x="390" y="138" class="txt-body">• Runs git diff baseRef...HEAD</text>
  <text x="390" y="160" class="txt-body">• Throws GradleException on failure</text>

  <!-- PrintAffectedTasksTask -->
  <rect x="372" y="206" width="280" height="138" rx="6" class="card"/>
  <rect x="372" y="206" width="4" height="138" rx="2" class="g-green-bar"/>
  <text x="390" y="232" class="txt-title">PrintAffectedTasksTask</text>
  <text x="390" y="256" class="txt-body">• @DisableCachingByDefault</text>
  <text x="390" y="278" class="txt-body">• Serializable @Input properties</text>
  <text x="390" y="300" class="txt-body">• Zero Task.project references</text>
  <text x="390" y="322" class="txt-body">• Prints matched tasks to stdout</text>

  <!-- ==================== RIGHT ZONE: PURE KOTLIN SEAM ==================== -->
  <rect x="700" y="24" width="352" height="342" rx="8" class="zone-core"/>
  <text x="720" y="48" class="txt-zone-core">PURE KOTLIN SEAM · NO GRADLE IMPORTS</text>

  <!-- AffectedModuleCalculator -->
  <rect x="720" y="66" width="312" height="148" rx="6" class="card-core"/>
  <text x="738" y="92" class="txt-title-core">AffectedModuleCalculator</text>
  <text x="738" y="118" class="txt-body">• Longest-prefix module path matching</text>
  <text x="738" y="140" class="txt-body">• Separates src/test vs src/androidTest</text>
  <text x="738" y="162" class="txt-body">• Transitive BFS on reverseDependencies</text>
  <text x="738" y="184" class="txt-body">• Pure function: calculate(...)</text>

  <!-- AffectedAnalysisResult -->
  <rect x="720" y="242" width="312" height="102" rx="6" class="card-res"/>
  <text x="738" y="268" class="txt-title-res">AffectedAnalysisResult</text>
  <text x="738" y="294" class="txt-body">• affectedTestModules / ScreenshotModules</text>
  <text x="738" y="316" class="txt-body">• affectedAndroidTestModules / LintModules</text>

  <!-- ==================== CONNECTORS ==================== -->
  <path d="M 188 190 L 188 217" class="wire" marker-end="url(#a4)"/>
  <path d="M 328 118 L 369 118" class="wire" marker-end="url(#a4)"/>
  <path d="M 328 154 L 369 242" class="wire" marker-end="url(#a4)"/>
  <path d="M 512 176 L 512 203" class="wire" marker-end="url(#a4)"/>
  <path d="M 652 275 L 717 154" class="wire-core" marker-end="url(#a4c)"/>
  <path d="M 876 214 L 876 239" class="wire-core" marker-end="url(#a4c)"/>
</svg>
